<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STK Trigger</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        button {
            padding: 20px 60px;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            background: #07C160;
            color: white;
            cursor: pointer;
            margin: 10px;
        }
        button:active { opacity: 0.7; }
        button.custom { background: #576B95; }
        input {
            padding: 12px 16px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 200px;
            text-align: center;
            margin: 10px;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <h2>STK 触发器</h2>
    <button onclick="sendTrigger()">触发（默认码）</button>
    <br>
    <input id="code" placeholder="自定义码（可选）" maxlength="20">
    <br>
    <button class="custom" onclick="sendTriggerWithCode()">触发（自定义码）</button>
    <p id="status"></p>

    <script>
        var TOKEN = "821c4bffa77242268d9664c3e3a24cce";
        var URL = "https://www.pushplus.plus/send";

        function sendTrigger() {
            send("STK_TRIGGER");
        }

        function sendTriggerWithCode() {
            var code = document.getElementById("code").value.trim();
            if (!code) {
                document.getElementById("status").innerText = "请输入自定义码";
                return;
            }
            send("STK_TRIGGER:" + code);
        }

        function send(title) {
            var s = document.getElementById("status");
            s.innerText = "发送中...";
            var img = new Image();
            img.onload = function() {
                s.innerText = "已发送: " + title;
            };
            img.onerror = function() {
                s.innerText = "已发送: " + title;
            };
            img.src = URL + "?token=" + TOKEN + "&title=" + encodeURIComponent(title) + "&content=go&t=" + Date.now();
        }
    </script>
</body>
</html>
